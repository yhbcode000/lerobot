# Master Configuration for SO-101 HIL-SERL Training
output_dir: outputs/sac_so101_pick_cube
job_name: sac_online_training
seed: 1000
device: cuda
steps: 100000
batch_size: 256

# Weights & Biases for monitoring intervention rates
wandb:
  enable: true
  project: "so101_hil_serl"
  disable_artifact: true

# Dataset for offline "seed" demonstrations
dataset:
  repo_id: "aractingi/pick_lift_cube_pipeline_test_cropped_resized"
  use_imagenet_stats: false

# Soft Actor-Critic (SAC) Policy Settings
policy:
  type: sac
  n_obs_steps: 1
  device: cuda
  storage_device: cuda
  use_amp: true
  
  # Architecture
  vision_encoder_name: "helper2424/resnet10"
  freeze_vision_encoder: false        # Allow visual features to adapt during RL
  image_encoder_hidden_dim: 256
  shared_encoder: true
  
  # RL Hyperparameters (Optimized for Sample Efficiency)
  online_steps: 1000000
  online_buffer_capacity: 50000
  offline_buffer_capacity: 20000
  online_step_before_learning: 500    # Collect some initial transitions first
  utd_ratio: 4                        # Update 4 times per environment step for faster learning
  temperature_init: 0.01
  discount: 0.97
  
  # Distributed Actor-Learner Sync
  actor_learner_config:
    learner_host: "127.0.0.1"
    learner_port: 50051
    policy_parameters_push_frequency: 1.0 # 1s frequency for fresher weights on robot

  input_features:
    observation.images.top:
      type: VISUAL
      shape: [3, 128, 128]
    observation.state:
      type: STATE
      shape: [18]
  output_features:
    action:
      type: ACTION
      shape: [3]

robot:
  type: so101_follower         # Updated to your custom registration
  port: "/dev/ttyACM0"
  id: "R12255108"
  cameras:
    top:
      type: opencv
      index_or_path: 2
      height: 480
      width: 640
      fps: 30

teleop:
  type: so101_leader           # Recommended for high-fidelity HIL interventions
  port: "/dev/ttyACM1"
  id: "R07255108"

# Real Robot Environment Settings
env:
  type: gym_manipulator
  name: real_robot
  fps: 10

  processor:
    control_mode: leader
    max_gripper_pos: 30.0
    
    observation:
      display_cameras: true      # Visual feedback is critical during HIL
      add_joint_velocity_to_observation: true
      add_current_to_observation: true
      add_ee_pose_to_observation: true
    
    image_preprocessing:
      crop_params_dict:
        observation.images.top: [49, 189, 262, 305]
      resize_size: [128, 128]
    
    reset:
      fixed_reset_joint_positions: [0.0, 12.0, -10.0, 40.0, 0.0, 2.6]
      reset_time_s: 4.0
      control_time_s: 20.0
      terminate_on_success: true

    inverse_kinematics:
      urdf_path: "configs/robots/SO101/so101_new_calib.urdf"
      target_frame_name: "moving_arm_link"
      end_effector_bounds:
        min: [0.0785, -0.1812, 0.0318]
        max: [0.3329, 0.2511, 0.4505]