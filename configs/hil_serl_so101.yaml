# Main HIL-SERL Configuration for SO-101
# Robot Setup (Follower)

env:
  name: real_robot
  task: so101_grab
  fps: 10

  robot:
    type: so101_follower
    port: /dev/ttyACM0
    id: R12255108
    disable_torque_on_disconnect: true
    cameras:
      handeye:
        type: opencv
        index_or_path: 4
        width: 640
        height: 360
        fps: 30

  # Teleoperation Setup (Leader)
  teleop:
    type: so101_leader_ee
    port: /dev/ttyACM1
    id: R07255108
    urdf_path: "configs/robots/SO101/so101_new_calib.urdf"
    target_frame_name: "gripper_frame_link"
    # use_gripper: true # not implemented yet

  # teleop:
  #   type: keyboard_ee

  # HIL-SERL Processor Pipeline
  processor:
    control_mode: leader
    max_gripper_pos: 100.0

    gripper:
      use_gripper: true
    
    observation:
      add_joint_velocity_to_observation: true
      add_current_to_observation: true
      display_cameras: true
    
    reset:
      # Using a neutral pose based on your min/max joint positions
      fixed_reset_joint_positions: [0.0, 12.0, -10.0, 40.0, 0.0, 2.6]
      reset_time_s: 5.0
      control_time_s: 20.0
      terminate_on_success: true

    image_preprocessing:
      # Placeholder: Update these values after running the ROI crop tool
      crop_params_dict: 
        observation.images.handeye: [0, 0, 360, 640]
      resize_size: [128, 128]
    
    inverse_kinematics:
      urdf_path: "configs/robots/SO101/so101_new_calib.urdf"
      target_frame_name: "gripper_frame_link"
      end_effector_bounds:
        max: [0.3329, 0.2511, 0.4505]
        min: [0.0785, -0.1812, 0.0318]
      end_effector_step_sizes:
        x: 0.02
        y: 0.02
        z: 0.02

dataset:
  repo_id: yhbcode000/so101_hil_dataset
  task: "Grab the piece"
  push_to_hub: false

device: cuda